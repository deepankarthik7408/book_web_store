<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            height: 100vh;
            display: flex;
        }
        .left-section {
            width: 20%;
            height: 100vh;
            background-color: #D2B48C;

          display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 100px;
            gap: 20px;
        }

        .button {
            width: 80%;
            padding: 20px;
            border: none;
            border-radius: 8px;
            background-color: white;
            color: #D2B48C;
            font-size: 30px;
            cursor: pointer;
        }
      .button:hover {
            background-color: #f0e6d6;
      }

      /* WHITE SECTION */
        .white-section {
            width: 80%;
            height: 100vh;
            padding: 100px;
          
        }

        /* 2 COLUMNS */
        .image-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* CLICKABLE IMAGE */
      .image-button {
            width: 200px;
            height: 250px;
            border: none;
            background-color: #f5f5f5;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
}

        .image-button img {
            width: 100%;
            height: 250px;
            object-fit: fill;
            border-radius: 10px;
            display: block;
        }

        .image-button:hover img {
            opacity: 0.8;
        }

    </style>
</head>

<body>

    <div class="left-section">

      <button class="button" onclick="window.location.href='index.html'">
            Home
        </button>

        <button class="button" onclick="window.location.href='search.html'">
            Search
        </button>
      
    </div>
  <div class="white-section">

       <div class="image-container">

            <!-- IMAGE 1 -->
            <a href="book1.html" class="image-button">
                <img src="c:\bookweb\test_book_1.jpeg" alt="Book 1">
            </a>

            <!-- IMAGE 2 -->
            <a href="book2.html" class="image-button">
                <img src="c:\bookweb\test_book_2.jpeg" alt="Book 2">
            </a>

            <!-- IMAGE 3 -->
            <a href="book3.html" class="image-button">
                <img src="picture3.jpg" alt="Book 3">
            </a>

            <!-- IMAGE 4 -->
            <a href="book4.html" class="image-button">
                <img src="picture4.jpg" alt="Book 4">
            </a>

        </div>
  </div>

</body>
</html>
