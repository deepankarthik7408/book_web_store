<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Page</title>

    <style>

        /* Whole webpage */
        body {
            margin: 0;
            padding: 0;
            background-color: white;
            height: 100vh;
        }

        /* Image */
        .top-image {
            width: 200px;
            height: 200px;

            object-fit: contain;

            /* Position */
            position: relative;
            left: 50%;
            transform: translateX(-50%);

            margin-top: 30px;
        }

    </style>
</head>

<body>

    <img 
        src="test_book_1.jpeg" 
        alt="Book"
        class="top-image"
    >

</body>
</html>
